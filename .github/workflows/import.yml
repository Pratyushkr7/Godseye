name: Import upload parts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack parts, drop misplaced duplicates, commit
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage
          for z in _import-part*.zip; do unzip -q -o "$z" -d /tmp/stage; done
          echo "staged files: $(find /tmp/stage -type f | wc -l)"
          git ls-files | grep -v -E '^(_import-part|\.github/)' | while read -r f; do
            if [ -f "/tmp/stage/$f" ] && cmp -s "$f" "/tmp/stage/$f"; then
              :
            elif [ -f "/tmp/stage/src/$f" ] && cmp -s "$f" "/tmp/stage/src/$f"; then
              git rm -q -- "$f"
            else
              echo "UNMATCHED (kept): $f"
            fi
          done
          rsync -a /tmp/stage/ ./
          git rm -q -- _import-part*.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import godseye project files"
          git push
